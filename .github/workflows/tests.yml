name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # RAG 依赖采用延迟加载；离线单测只安装核心包，显著降低 CI 时间和供应链面。
      - run: python -m pip install -r requirements-core.txt "pytest>=8,<10"
      - run: python -m compileall backend context tools workflow tests main.py
      - run: pytest -q -m "not regression"
        env:
          DEEPSEEK_API_KEY: test
          GITHUB_TOKEN: test
          REPOMIND_JOB_DB: /tmp/repomind-api-tests.sqlite
