<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepoMind — GitHub Issue 智能分析</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 24px 32px;
    border-bottom: 1px solid #21262d;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 600; color: #f0f6fc; }
  header span { font-size: 13px; color: #8b949e; }
  .logo { font-size: 24px; }

  /* ── Main layout ── */
  main {
    max-width: 900px;
    margin: 48px auto;
    padding: 0 24px;
  }

  /* ── Input card ── */
  .input-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 32px;
  }
  .input-card h2 { font-size: 16px; color: #8b949e; margin-bottom: 16px; font-weight: 400; }

  .input-row {
    display: flex;
    gap: 12px;
  }
  input[type="text"] {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  input[type="text"]:focus { border-color: #388bfd; }
  input[type="text"]::placeholder { color: #484f58; }

  button {
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  /* ── Status bar ── */
  #status-bar {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding: 12px 16px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    font-size: 13px;
    color: #8b949e;
  }
  #status-bar.visible { display: flex; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #30363d;
    border-top-color: #388bfd;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.done    { background: #3fb950; }
  .dot.failed  { background: #f85149; }
  .dot.pending { background: #d29922; }

  /* ── Result ── */
  #result { display: none; }
  #result.visible { display: block; }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .meta-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
  }
  .meta-card .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
  .meta-card .value { font-size: 15px; font-weight: 600; color: #f0f6fc; }

  .severity-critical { color: #f85149; }
  .severity-high     { color: #d29922; }
  .severity-medium   { color: #388bfd; }
  .severity-low      { color: #3fb950; }

  .section {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .section h3 {
    font-size: 13px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: 12px;
  }
  .section p, .section li { font-size: 14px; line-height: 1.6; color: #c9d1d9; }
  .section ul { padding-left: 16px; }
  .section li { margin-bottom: 4px; }

  .tag {
    display: inline-block;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 12px;
    color: #8b949e;
    margin: 2px;
  }

  .file-path {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    color: #58a6ff;
    background: #1c2128;
    border-radius: 4px;
    padding: 2px 6px;
  }

  .change-item {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .change-item .file { color: #58a6ff; font-family: monospace; }
  .change-item .line { color: #8b949e; margin: 0 6px; }
  .change-item .desc { color: #c9d1d9; }

  .confidence-bar {
    height: 6px;
    background: #21262d;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .confidence-fill {
    height: 100%;
    background: #3fb950;
    border-radius: 3px;
    transition: width .6s ease;
  }

  .report-pre {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 6px;
    padding: 16px;
    font-size: 13px;
    font-family: "SFMono-Regular", Consolas, monospace;
    white-space: pre-wrap;
    color: #c9d1d9;
    max-height: 400px;
    overflow-y: auto;
  }

  .copy-btn {
    background: #21262d;
    color: #8b949e;
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
    float: right;
    margin-top: -4px;
  }
  .copy-btn:hover { background: #30363d; color: #e6edf3; }

  .error-box {
    background: #1a0e0e;
    border: 1px solid #f85149;
    border-radius: 8px;
    padding: 16px 20px;
    color: #f85149;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <span class="logo">🔍</span>
  <h1>RepoMind</h1>
  <span>GitHub Issue 智能分析</span>
</header>

<main>
  <div class="input-card">
    <h2>输入 GitHub Issue URL，自动完成根因分析、代码定位、修复建议</h2>
    <div class="input-row">
      <input type="text" id="url-input"
        placeholder="https://github.com/owner/repo/issues/123"
        value="https://github.com/fastapi/fastapi/issues/13">
      <button id="submit-btn" onclick="submitAnalysis()">开始分析</button>
    </div>
    <div id="status-bar">
      <div id="status-icon" class="spinner"></div>
      <span id="status-text">正在提交任务...</span>
    </div>
  </div>

  <div id="result"></div>
</main>

<script>
let pollTimer = null;

async function submitAnalysis() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;

  document.getElementById('submit-btn').disabled = true;
  document.getElementById('result').className = '';
  document.getElementById('result').innerHTML = '';
  showStatus('spinner', '正在提交任务...');

  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({issue_url: url}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const {job_id} = await res.json();
    showStatus('spinner', '任务已提交，正在分析...');
    pollStatus(job_id);
  } catch (e) {
    showStatus('failed', `提交失败: ${e.message}`);
    document.getElementById('submit-btn').disabled = false;
  }
}

function pollStatus(jobId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/jobs/${jobId}`);
      const job  = await res.json();

      if (job.status === 'running') {
        showStatus('spinner', '分析中，LLM 正在处理...');
      } else if (job.status === 'done') {
        clearInterval(pollTimer);
        showStatus('done', '分析完成');
        renderResult(job.result);
        document.getElementById('submit-btn').disabled = false;
      } else if (job.status === 'failed') {
        clearInterval(pollTimer);
        showStatus('failed', `分析失败`);
        renderError(job.error || '未知错误');
        document.getElementById('submit-btn').disabled = false;
      }
    } catch (e) {
      clearInterval(pollTimer);
      showStatus('failed', `轮询失败: ${e.message}`);
      document.getElementById('submit-btn').disabled = false;
    }
  }, 2000);
}

function showStatus(type, text) {
  const bar  = document.getElementById('status-bar');
  const icon = document.getElementById('status-icon');
  const txt  = document.getElementById('status-text');
  bar.className = 'visible';
  txt.textContent = text;
  if (type === 'spinner') {
    icon.className = 'spinner';
  } else {
    icon.className = `dot ${type}`;
  }
}

function severityClass(s) {
  return `severity-${s || 'medium'}`;
}

function renderResult(r) {
  if (!r) return;

  const conf = Math.round((r.confidence || 0) * 100);
  const labels = (r.suggested_labels || []).map(l => `<span class="tag">${l}</span>`).join('');
  const files  = (r.affected_files || []).map(f =>
    `<li><span class="file-path">${esc(f)}</span></li>`).join('') || '<li>暂未确定</li>';
  const changes = (r.code_changes || []).map(c =>
    `<div class="change-item">
      <span class="file">${esc(c.file)}</span>
      ${c.line ? `<span class="line">L${c.line}</span>` : ''}
      <span class="desc">${esc(c.change)}</span>
    </div>`).join('') || '<p style="color:#484f58;font-size:13px">无具体代码改动建议</p>';

  const html = `
    <div class="meta-grid">
      <div class="meta-card">
        <div class="label">Issue</div>
        <div class="value">#${r.issue_number || '-'}</div>
      </div>
      <div class="meta-card">
        <div class="label">类型</div>
        <div class="value">${r.issue_type || '-'}</div>
      </div>
      <div class="meta-card">
        <div class="label">严重程度</div>
        <div class="value ${severityClass(r.severity)}">${r.severity || '-'}</div>
      </div>
      <div class="meta-card">
        <div class="label">分析置信度</div>
        <div class="value">${conf}%</div>
        <div class="confidence-bar">
          <div class="confidence-fill" style="width:${conf}%"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>根因分析</h3>
      <p>${esc(r.root_cause)}</p>
    </div>

    <div class="section">
      <h3>修复建议</h3>
      <p>${esc(r.fix_suggestion)}</p>
    </div>

    <div class="section">
      <h3>受影响文件</h3>
      <ul>${files}</ul>
    </div>

    <div class="section">
      <h3>代码改动建议</h3>
      ${changes}
    </div>

    ${labels ? `<div class="section"><h3>建议标签</h3><div>${labels}</div></div>` : ''}

    <div class="section">
      <h3>完整报告
        <button class="copy-btn" onclick="copyReport()">复制</button>
      </h3>
      <pre class="report-pre" id="report-text">${esc(r.final_report)}</pre>
    </div>
  `;

  const el = document.getElementById('result');
  el.innerHTML = html;
  el.className = 'visible';
}

function renderError(msg) {
  const el = document.getElementById('result');
  el.innerHTML = `<div class="error-box">❌ ${esc(msg)}</div>`;
  el.className = 'visible';
}

function copyReport() {
  const text = document.getElementById('report-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制', 2000);
  });
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'<br>');
}

// Enter 键触发
document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnalysis();
});
</script>
</body>
</html>
